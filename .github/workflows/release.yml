name: release
on:
  push: { tags: ["v*"] }

permissions: { contents: write }

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: corepack enable
      - run: corepack prepare pnpm@9.15.9 --activate
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt nuitka ordered-set pywin32
      - run: python scripts/prepare_frontend.py

      - name: Build exe
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}" -replace '^v',''
          python -m nuitka --onefile --assume-yes-for-downloads `
            --windows-console-mode=disable `
            --windows-icon-from-ico=assets/icon.ico `
            --include-package=win32com --include-package=win32 --include-module=pythoncom `
            --include-package-data=pypinyin `
            --include-data-dir=server/static=server/static `
            --output-filename="call-center-$v-x64.exe" `
            --output-dir=dist app/main.py

      - name: Smoke test exe (server role, no GUI)
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}" -replace '^v',''
          $exe = Resolve-Path "dist/call-center-$v-x64.exe"
          $marker = "$PWD/smoke-marker.txt"
          $env:CC_SMOKE_OUT = $marker
          # GUI 子系统 exe 用 & 调用不等待,必须 Start-Process -Wait;
          # 冒烟路径不碰 webview,无桌面也能跑(v0.1.5 学校机事故回归闸)。
          $p = Start-Process -FilePath $exe -ArgumentList "--smoke-server" -Wait -PassThru
          if (-not (Test-Path $marker)) {
            throw "smoke failed: marker missing, exit=$($p.ExitCode)"
          }
          Get-Content $marker

      - name: Manifest and release
        shell: pwsh
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          $v = "${{ github.ref_name }}" -replace '^v',''
          $exe = "dist/call-center-$v-x64.exe"
          $sha = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLower()
          $size = (Get-Item $exe).Length
          @{ version = $v; notes = "见 Release 说明"; asset = "call-center-$v-x64.exe";
             sha256 = $sha; size = $size } |
            ConvertTo-Json | Out-File dist/latest.json -Encoding utf8
          gh release create "${{ github.ref_name }}" $exe dist/latest.json --generate-notes
