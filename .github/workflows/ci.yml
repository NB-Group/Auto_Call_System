name: ci
on:
  push: { branches: ["**"] }
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements-dev.txt
      - run: pytest -v

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: corepack enable
      - run: corepack prepare pnpm@9.15.9 --activate
      - run: pnpm --dir frontend install
      - run: pnpm --dir frontend test
      - run: pnpm --dir frontend build

  nuitka-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: corepack enable
      - run: corepack prepare pnpm@9.15.9 --activate
      - run: pip install -r requirements.txt nuitka ordered-set
      - run: sudo apt-get update && sudo apt-get install -y ccache
      - run: python scripts/prepare_frontend.py
      - run: |
          python -m nuitka --onefile --assume-yes-for-downloads \
            --include-package-data=pypinyin \
            --include-data-dir=server/static=server/static \
            --output-dir=dist app/main.py
      - name: Smoke test exe (server role, no GUI)
        run: |
          export CC_SMOKE_OUT="$PWD/smoke-marker.txt"
          timeout 120 ./dist/main.bin --smoke-server
          cat smoke-marker.txt
      - uses: actions/upload-artifact@v4
        with: { name: linux-smoke, path: dist/main.bin }
        if: always()
